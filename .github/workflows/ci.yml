# HustleHub+ CI/CD pipeline
#
#  backend ──┐
#  frontend ─┼──► docker (build images ► scan images ► run full stack ► Newman ► ZAP DAST ► logs)
#  codeql   ─┤
#  semgrep  ─┤
#  trivy-fs ─┘──► quality-gate (fails the run if any job above failed)
#
# Every job fails the pipeline when its tests or checks fail. Reports are kept
# as downloadable artifacts on each run (Actions ► run ► Artifacts).

name: CI/CD

on:
  push:
    branches: [main, master, develop, 'part3-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TRIVY_IMAGE: aquasec/trivy:0.69.3 # known-safe release (see README: supply-chain note)

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · install, audit, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Dependency audit - production deps, fail on high/critical
        run: npm run audit:prod

      - name: Tests - Jest + Supertest on in-memory MongoDB (with coverage)
        run: npm run test:ci

      - name: Build - production install and start-up check
        env:
          NODE_ENV: production
          JWT_SECRET: ci-build-check-secret-that-is-long-enough-123456
          MONGODB_URI: mongodb://127.0.0.1:27017/build-check
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node -e "require('./src/app'); console.log('API module graph loads OK')"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · install, audit, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Dependency audit - production deps, fail on high/critical
        run: npm run audit:prod

      - name: Tests - Vitest + React Testing Library
        run: npm run test:ci

      - name: Build - production bundle
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Check the build has no inline scripts (required by the CSP)
        run: |
          if grep -Eq '<script>[^<]' dist/index.html; then
            echo "::error::dist/index.html contains an inline <script>, which the CSP blocks."
            exit 1
          fi
          echo "No inline scripts found."

      - name: Upload frontend test report and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report-and-build
          path: |
            frontend/reports/
            frontend/dist/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  codeql:
    name: SAST · CodeQL (security-extended)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/__tests__/**'
              - '**/node_modules/**'
              - '**/dist/**'

      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-javascript
          # Keep the SARIF locally so the gate below works on private repos
          # without GitHub Advanced Security.
          upload: never
          output: codeql-results

      - name: Upload to GitHub code scanning (public repos / GHAS only)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: codeql-results
          category: codeql-javascript

      - name: Quality gate - fail on high or critical findings
        run: python3 .github/scripts/sarif_gate.py codeql-results/*.sarif --min-security-severity 7.0 --title "CodeQL"

      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/

  # ---------------------------------------------------------------------------
  semgrep:
    name: SAST · Semgrep (OWASP Top 10, Node, React, secrets, Dockerfile)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Scan (full report, all severities)
        run: |
          semgrep scan \
            --config p/javascript --config p/nodejsscan --config p/react \
            --config p/owasp-top-ten --config p/secrets --config p/dockerfile \
            --exclude '**/__tests__/**' --exclude '*.test.js' --exclude '*.test.jsx' \
            --metrics off \
            --sarif --output semgrep.sarif

      - name: Quality gate - fail on ERROR-severity findings
        run: python3 .github/scripts/sarif_gate.py semgrep.sarif --fail-level error --title "Semgrep"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------------------
  trivy-fs:
    name: SCA · Trivy (dependencies, secrets, Dockerfile misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full report (all severities, kept as artifact)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --format json --output reports/trivy-fs.json --exit-code 0 .

      - name: Quality gate - fail on HIGH/CRITICAL (fixable) issues
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: reports/trivy-fs.json

  # ---------------------------------------------------------------------------
  docker:
    name: Docker · build, scan, run stack, Newman, ZAP DAST, logs
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create throwaway secrets for this run (never committed)
        run: |
          ADMIN_PASSWORD="Ci!$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$ADMIN_PASSWORD"
          cat > .env <<EOF
          MONGO_ROOT_USERNAME=hustlehub
          MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 48)
          ADMIN_EMAIL=admin@hustlehub.test
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          EOF
          echo "ADMIN_EMAIL=admin@hustlehub.test" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build both images (API and client)
        run: docker compose build

      - name: Scan images - report all, fail on fixable CRITICAL
        run: |
          mkdir -p reports/trivy
          for image in hustlehub-api:local hustlehub-client:local; do
            name="${image%%:*}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" \
              "$TRIVY_IMAGE" image --format json --output "/reports/trivy/$name.json" --exit-code 0 "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$image"
          done

      - name: Start the stack and wait until every container is healthy
        run: docker compose up -d --wait --wait-timeout 240

      - name: Show running containers
        if: always()
        run: docker compose ps

      - name: Smoke test - HTTPS, security headers, API through nginx
        run: |
          curl -fsSk https://localhost:3000/ -o /dev/null
          curl -sSkI https://localhost:3000/ | tee headers.txt
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          grep -qi "strict-transport-security" headers.txt
          curl -fsSk https://localhost:3000/api/health
          ! curl -fsSk --max-time 3 https://localhost:5443/api/health  # API must not be exposed directly

      - name: Newman - Part 3 regression collection (80 requests)
        run: |
          mkdir -p reports/newman
          npx --yes -p newman@6 -p newman-reporter-htmlextra newman run postman/HustleHub_Part3.postman_collection.json \
            --insecure \
            --env-var "baseUrl=https://localhost:3000/api" \
            --env-var "adminEmail=$ADMIN_EMAIL" \
            --env-var "adminPassword=$ADMIN_PASSWORD" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export reports/newman/part3-junit.xml \
            --reporter-htmlextra-export reports/newman/part3-report.html \
            --reporter-htmlextra-skipSensitiveData

      - name: Newman - rate limit loop (must end in 429)
        run: |
          npx --yes -p newman@6 -p newman-reporter-htmlextra newman run postman/HustleHub_RateLimit.postman_collection.json \
            --insecure \
            --env-var "baseUrl=https://localhost:3000/api" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export reports/newman/ratelimit-junit.xml \
            --reporter-htmlextra-export reports/newman/ratelimit-report.html

      - name: DAST - OWASP ZAP baseline scan against the running stack
        run: |
          mkdir -p reports/zap && chmod 777 reports/zap
          cp .zap/rules.tsv reports/zap/rules.tsv
          # Passive scan of the live HTTPS app. Rules in .zap/rules.tsv that are
          # marked FAIL (missing CSP, HSTS, nosniff, clickjacking protection,
          # X-Powered-By leak) fail the build; other findings are reported.
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://localhost:3000 -c rules.tsv -I \
            -r zap-report.html -J zap-report.json -w zap-report.md

      - name: Collect logging evidence
        if: always()
        run: |
          mkdir -p reports/logs
          docker compose logs --no-color --timestamps api > reports/logs/api.log || true
          docker compose logs --no-color --timestamps client > reports/logs/client.log || true
          {
            echo "### Logging evidence (API container)"
            echo ""
            echo "| Event | Count |"
            echo "|---|---|"
            for e in auth.register auth.login.success auth.login.failure auth.login.locked auth.logout \
                     access.denied booking.create transaction.create admin.user.suspend admin.gig.remove; do
              echo "| \`$e\` | $(grep -c "\"event\":\"$e\"" reports/logs/api.log || true) |"
            done
            echo "| Rate limit exceeded | $(grep -c 'Rate limit exceeded' reports/logs/api.log || true) |"
            echo "| Errors (level=error) | $(grep -c '\"level\":\"error\"' reports/logs/api.log || true) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Newman, Trivy image and log reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-evidence
          path: reports/

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, codeql, semgrep, trivy-fs, docker]
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} codeql=${{ needs.codeql.result }}"
          echo "semgrep=${{ needs.semgrep.result }} trivy-fs=${{ needs.trivy-fs.result }} docker=${{ needs.docker.result }}"
          for r in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.codeql.result }}" \
                   "${{ needs.semgrep.result }}" "${{ needs.trivy-fs.result }}" "${{ needs.docker.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::A required job did not pass."; exit 1; fi
          done
          echo "All checks passed."
