# HustleHub+ client: serves the built React app over HTTPS and proxies /api to
# the API container, so the browser only ever talks to one origin.

server_tokens off;

upstream hustlehub_api {
  server api:5443;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name localhost;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  root  /usr/share/nginx/html;
  index index.html;

  client_max_body_size 16k;

  # Container health check (no logs, no app involved).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API: re-encrypted to the API container, which enforces its own headers.
  location /api/ {
    proxy_pass https://hustlehub_api;
    proxy_ssl_verify off;            # internal self-signed cert on the private network
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host              $proxy_host;   # fixed upstream name, never the client's Host header
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_read_timeout 30s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Client-side routes all serve index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
