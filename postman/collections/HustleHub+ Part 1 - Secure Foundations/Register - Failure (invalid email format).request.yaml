$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Bad Email User",
      "email": "not-an-email",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
