$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Sneaky Admin",
      "email": "sneaky.tester@example.com",
      "password": "{{testPassword}}",
      "role": "admin"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400 - admin role cannot self-register', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
