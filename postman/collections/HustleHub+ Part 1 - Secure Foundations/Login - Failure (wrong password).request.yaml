$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "TotallyWrongPass1!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      pm.test('Generic message, no user enumeration', () => pm.expect(pm.response.json().message).to.eql('Invalid email or password.'));
    language: text/javascript
order: 8000
