$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Weak Password User",
      "email": "weakpass.tester@example.com",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Validation errors returned', () => pm.expect(pm.response.json().errors.length).to.be.above(0));
    language: text/javascript
order: 4000
