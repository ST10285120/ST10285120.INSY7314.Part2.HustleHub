$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response indicates success', () => pm.expect(pm.response.json().success).to.be.true);
    language: text/javascript
order: 1000
