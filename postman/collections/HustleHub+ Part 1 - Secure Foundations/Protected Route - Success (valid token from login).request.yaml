$kind: http-request
url: "{{baseUrl}}/auth/profile"
method: GET
headers:
  Authorization: Bearer {{authToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns the authenticated user profile', () => pm.expect(pm.response.json().data.user.email).to.eql(pm.collectionVariables.get('testEmail')));
    language: text/javascript
order: 12000
